# perf 프로파일 전용 설정 (nGrinder 부하 테스트)
# 사용 예: SPRING_PROFILES_ACTIVE=dev,perf
spring.config.activate.on-profile=perf

# [Phase 2-B] HikariCP 커넥션 풀 확장
# 기본값(10)으로는 50 Vuser 동시 요청 시 REQUIRES_NEW 트랜잭션이 커넥션을 추가 점유
# → Connection is not available, request timed out after 30000ms 발생
# [BEFORE] spring.datasource.hikari.maximum-pool-size=10
# 계산 근거: 50 Vuser × 커넥션 최대 4개(외부tx + saveVote + earnPoints + recordActivity) = 최대 200개
# V500 기준: 500 동시 요청 × 1 커넥션 = 500개 필요, 여유분 포함
spring.datasource.hikari.maximum-pool-size=600
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=60000
